[project]
name = "upwork-cron"
version = "0.1.0"
description = "Poll the Upwork MCP for new AI jobs and notify on the desktop"
requires-python = ">=3.10"
dependencies = [
    "mcp",
]

[project.scripts]
upwork-cron = "upwork_cron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upwork_cron"]