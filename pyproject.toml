[project]
name = "upwork-cron"
version = "0.2.0"
description = "Poll the Upwork MCP for new AI jobs and send desktop notifications"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "windows-toasts>=1.0.0; sys_platform == 'win32'",
]

[project.scripts]
upwork-cron = "upwork_cron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upwork_cron"]